name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_diagrams.py
      - run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public demo
        env:
          DEMO_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$DEMO_URL" -o /tmp/zh-demo.html
          python -c 'from pathlib import Path; content = Path("/tmp/zh-demo.html").read_text(); assert "./local-engine.js" in content and "./app.js" in content, "Published demo is incomplete"'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${DEMO_URL}architecture.svg" -o /tmp/zh-architecture.svg
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${DEMO_URL}visualization.js" -o /tmp/zh-visualization.js
          python -c 'from pathlib import Path; assert "GigaNetwork" in Path("/tmp/zh-architecture.svg").read_text(); assert "GameVisuals" in Path("/tmp/zh-visualization.js").read_text()'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${DEMO_URL}cowork.js" -o /tmp/zh-cowork.js
          python -c 'from pathlib import Path; assert "CoWork" in Path("/tmp/zh-cowork.js").read_text()'
          for asset in guide.js process.svg request.svg states.svg hero-team.png business-data.js workbench.js; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${DEMO_URL}${asset}" -o "/tmp/zh-${asset}"
          done
          python -c 'from pathlib import Path; assert "HowItWorks" in Path("/tmp/zh-guide.js").read_text()'
