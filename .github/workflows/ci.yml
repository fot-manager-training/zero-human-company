name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game and HTTP API tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: |
          node --check static/app.js
          node --check static/local-engine.js
      - name: Build standalone demo
        run: python scripts/build_pages.py
