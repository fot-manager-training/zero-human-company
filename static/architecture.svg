<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
<title id="title">Архитектура бизнес-игры «Человек и ИИ»</title><desc id="desc">Путь поручения от участника к помощникам и обратно.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#479375"/></marker><style>text{font-family:Arial,sans-serif;fill:#344e40}.heading{font-size:28px;font-weight:bold}.sub{font-size:14px;fill:#8a9c90}.label{font-size:11px;letter-spacing:1.5px;fill:#8a9c90}.name{font-size:18px;font-weight:bold}.body{font-size:13px;fill:#7a8e7f}.tag{font-size:10px;fill:#aa8551}.edge{fill:none;stroke:#6da488;stroke-width:2;marker-end:url(#arrow)}.planned{stroke-dasharray:6 5}.box{fill:#fff;stroke:#d4e2d7;stroke-width:1.5}.note{font-size:12px;fill:#a0804f}</style></defs>
<rect width="1280" height="980" rx="18" fill="#fbfdfb"/><text x="45" y="55" class="label">HUMAN + AI TEAM / АРХИТЕКТУРА БИЗНЕС-ИГРЫ</text><text x="45" y="103" class="heading">Человек принимает решения. ИИ помогает команде.</text><text x="45" y="135" class="sub">Пунктир — целевая интеграция. Сплошная линия — реализованный обмен внутри игрового движка.</text>
<rect x="32" y="164" width="1216" height="442" rx="18" fill="#f0f5f1"/><text x="53" y="194" class="label">ЦЕЛЕВАЯ СХЕМА ПОДКЛЮЧЕНИЯ · ВНЕШНИЕ ПЛАТФОРМЫ СЕЙЧАС ЭМУЛИРУЮТСЯ</text>
<rect class="box" x="52" y="232" width="174" height="120" rx="12"/><text x="70" y="261" class="name">1. Участник</text><text x="70" y="287" class="body">Стол 01–10</text><text x="70" y="309" class="body">Пишет поручение</text><text x="70" y="331" class="body">своему агенту</text>
<rect class="box" x="265" y="232" width="213" height="120" rx="12"/><text x="283" y="261" class="name">2. GigaCoWork</text><text x="283" y="287" class="body">Чат стола и его агент</text><text x="283" y="309" class="body">Отправка через коннектор</text>
<rect class="box" x="518" y="232" width="212" height="120" rx="12"/><text x="536" y="261" class="name">3. Входной API</text><text x="536" y="287" class="body">Токен → проверка стола</text><text x="536" y="309" class="body">ID запроса → без повторов</text><text x="536" y="331" class="body">Текст → задача агента</text>
<rect x="773" y="225" width="251" height="134" rx="12" fill="#e4f3e9" stroke="#aacdb7"/><text x="791" y="255" class="name">4. GigaNetwork</text><text x="791" y="282" class="body">Оркестрация и маршрутизация</text><text x="791" y="304" class="body">Зависимости → выбор агента</text>
<path class="edge planned" d="M226 290H265"/><path class="edge planned" d="M478 290H518"/><path class="edge" d="M730 290H773"/>
<path class="edge" d="M900 359V416"/>
<rect class="box" x="773" y="420" width="251" height="116" rx="12"/><text x="791" y="450" class="name">5. Десять агентов</text><text x="791" y="477" class="body">Читают входные результаты</text><text x="791" y="499" class="body">Считают и передают документы</text><text x="791" y="520" class="body">Ждут решение ведущего</text>
<rect class="box" x="1060" y="420" width="166" height="116" rx="12"/><text x="1076" y="450" class="name">Данные</text><text x="1076" y="477" class="body">Заказ и документы</text><text x="1076" y="499" class="body">Смета и тираж</text><text x="1076" y="520" class="body">Журнал событий</text>
<path class="edge" d="M1024 476H1060"/>
<rect class="box" x="518" y="420" width="212" height="116" rx="12"/><text x="536" y="450" class="name">6. Сайт игры</text><text x="536" y="477" class="body">Человечки и стрелки</text><text x="536" y="499" class="body">Переписка агентов</text><text x="536" y="520" class="body">Статусы и готовый заказ</text>
<path class="edge" d="M773 476H730"/>
<rect x="265" y="420" width="213" height="116" rx="12" fill="#fff8eb" stroke="#ead8b6"/><text x="283" y="450" class="name">Ответ в чат</text><text x="283" y="477" class="body">Результат и статус заказа</text><text x="283" y="499" class="body">Обратный коннектор</text>
<path class="edge planned" d="M518 476H478"/><path class="edge planned" d="M370 420V352"/>

<text x="45" y="654" class="heading">Что выполняется в текущей демонстрации</text>
<rect x="45" y="683" width="575" height="221" rx="14" fill="#eaf4ed" stroke="#c9dece"/><text x="66" y="714" class="name">Публичная версия · GitHub Pages</text><text x="66" y="746" class="body">Терминал в браузере → локальный игровой движок → агенты</text><text x="66" y="774" class="body">Агенты → расчёты и сообщения → схема и журнал на экране</text><text x="66" y="802" class="body">localStorage хранит одну личную демо-сессию в браузере.</text><text x="66" y="839" class="body">Синтетические данные, ускорение ×1–×16, полный автопрогон.</text>
<rect x="646" y="683" width="589" height="221" rx="14" fill="#f0f3fa" stroke="#d6dfee"/><text x="668" y="714" class="name">Серверная версия · код в репозитории</text><text x="668" y="746" class="body">REST API → Python-оркестратор → цепочка из 10 агентов</text><text x="668" y="774" class="body">Результаты, сообщения и заказ → SQLite → обновления сайта</text><text x="668" y="802" class="body">Все столы могут работать в одной серверной сессии.</text><text x="668" y="839" class="body">Входной REST-адаптер GigaCoWork реализован.</text>

</svg>
