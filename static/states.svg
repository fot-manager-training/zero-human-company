<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="540" viewBox="0 0 1320 540" role="img" aria-labelledby="title"><title id="title">Работа, общение и ожидание решения человека</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77a4d8"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d314e}.title{font-size:25px;font-weight:700;letter-spacing:-.6px}.zone{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#7295bd}.name{font-size:15px;font-weight:700}.body{font-size:12px;fill:#7790ad}.small{font-size:10px;fill:#89a0bb}.label{font-size:11px;fill:#5c80af}.line{fill:none;stroke:#77a4d8;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.human{stroke:#99ba35}.emph{fill:#467ec7}.num{font-size:11px;fill:#93acd0}.box{fill:#fff;stroke:#cbdbef;stroke-width:1.5}</style></defs><rect width="1320" height="540" rx="20" fill="#fff"/><text x="30" y="45" class="title" text-anchor="start">Состояние помощника следует за событиями процесса</text><rect x="22" y="144" width="176" height="126" rx="13" fill="#f6f8fb" stroke="#cbdbef" stroke-width="1.5"/><text x="110.0" y="172" class="name" text-anchor="middle">Ожидает</text><text x="110.0" y="198" class="body" text-anchor="middle">Входные данные</text><text x="110.0" y="218" class="body" text-anchor="middle">ещё не готовы</text><path d="M198 207H242" class="line  "/><rect x="242" y="144" width="176" height="126" rx="13" fill="#eef5ff" stroke="#cbdbef" stroke-width="1.5"/><text x="330.0" y="172" class="name" text-anchor="middle">Ваш ход</text><text x="330.0" y="198" class="body" text-anchor="middle">Можно написать</text><text x="330.0" y="218" class="body" text-anchor="middle">поручение</text><path d="M418 207H462" class="line  "/><rect x="462" y="144" width="176" height="126" rx="13" fill="#fff8df" stroke="#cbdbef" stroke-width="1.5"/><text x="550.0" y="172" class="name" text-anchor="middle">Работает</text><text x="550.0" y="198" class="body" text-anchor="middle">Расчёты, проверки,</text><text x="550.0" y="218" class="body" text-anchor="middle">подготовка результата</text><path d="M638 207H682" class="line  "/><rect x="682" y="144" width="176" height="126" rx="13" fill="#eef9ed" stroke="#cbdbef" stroke-width="1.5"/><text x="770.0" y="172" class="name" text-anchor="middle">Результат готов</text><text x="770.0" y="198" class="body" text-anchor="middle">Данные доступны</text><text x="770.0" y="218" class="body" text-anchor="middle">для следующей роли</text><path d="M858 207H902" class="line  "/><rect x="902" y="144" width="176" height="126" rx="13" fill="#edf5ff" stroke="#cbdbef" stroke-width="1.5"/><text x="990.0" y="172" class="name" text-anchor="middle">Доставка данных</text><text x="990.0" y="198" class="body" text-anchor="middle">Персонаж несёт</text><text x="990.0" y="218" class="body" text-anchor="middle">информацию коллеге</text><path d="M1078 207H1122" class="line  "/><rect x="1122" y="144" width="176" height="126" rx="13" fill="#f6f8fb" stroke="#cbdbef" stroke-width="1.5"/><text x="1210.0" y="172" class="name" text-anchor="middle">Свёрнут</text><text x="1210.0" y="198" class="body" text-anchor="middle">Задача завершена,</text><text x="1210.0" y="218" class="body" text-anchor="middle">карточка компактна</text><rect x="240" y="364" width="188" height="113" rx="13" fill="#f8fcdf" stroke="#cadc8d" stroke-width="1.5"/><text x="334.0" y="392" class="name" text-anchor="middle">Нужно решение</text><text x="334.0" y="418" class="body" text-anchor="middle">Закупки показывают</text><text x="334.0" y="438" class="body" text-anchor="middle">рекомендацию человеку</text><rect x="480" y="364" width="188" height="113" rx="13" fill="#f8fcdf" stroke="#cadc8d" stroke-width="1.5"/><text x="574.0" y="392" class="name" text-anchor="middle">Капитан согласовал</text><text x="574.0" y="418" class="body" text-anchor="middle">Заказ проверен</text><text x="574.0" y="438" class="body" text-anchor="middle">Можно выполнять</text><path d="M330 270V364" class="line dash human"/><path d="M428 420H480" class="line  human"/><path d="M574 364V305H550V270" class="line dash human"/><text x="330" y="320" class="label" text-anchor="middle">Для закупок</text><text x="740" y="376" class="body" text-anchor="start">Во время работы раскрывается карточка с действием</text><text x="740" y="401" class="body" text-anchor="start">и коротким пояснением. Во время общения — отправитель</text><text x="740" y="426" class="body" text-anchor="start">и получатель. После доставки помощник сворачивается.</text><text x="740" y="469" class="body" text-anchor="start">Сообщения находятся в отдельной полосе под сценой.</text></svg>