<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1320" viewBox="0 0 1290 1320" role="img" aria-labelledby="title"><title id="title">Путь одного поручения и согласование результата</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77a4d8"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d314e}.title{font-size:25px;font-weight:700;letter-spacing:-.6px}.zone{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#7295bd}.name{font-size:15px;font-weight:700}.body{font-size:12px;fill:#7790ad}.small{font-size:10px;fill:#89a0bb}.label{font-size:11px;fill:#5c80af}.line{fill:none;stroke:#77a4d8;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.human{stroke:#99ba35}.emph{fill:#467ec7}.num{font-size:11px;fill:#93acd0}.box{fill:#fff;stroke:#cbdbef;stroke-width:1.5}</style></defs><rect width="1290" height="1320" rx="20" fill="#fff"/><text x="30" y="45" class="title" text-anchor="start">Пример: стол 03 готовит смету на 110 подарков</text><rect x="6" y="76" width="188" height="58" rx="13" fill="#f2f7ff" stroke="#cbdbef" stroke-width="1.5"/><text x="100.0" y="104" class="name" text-anchor="middle">Команда стола</text><path d="M100 134V1280" fill="none" stroke="#d5e2f2" stroke-dasharray="4 5"/><rect x="276" y="76" width="188" height="58" rx="13" fill="#f2f7ff" stroke="#cbdbef" stroke-width="1.5"/><text x="370.0" y="104" class="name" text-anchor="middle">Помощник GigaCoWork</text><path d="M370 134V1280" fill="none" stroke="#d5e2f2" stroke-dasharray="4 5"/><rect x="556" y="76" width="188" height="58" rx="13" fill="#f2f7ff" stroke="#cbdbef" stroke-width="1.5"/><text x="650.0" y="104" class="name" text-anchor="middle">Игровой движок</text><path d="M650 134V1280" fill="none" stroke="#d5e2f2" stroke-dasharray="4 5"/><rect x="816" y="76" width="188" height="58" rx="13" fill="#f2f7ff" stroke="#cbdbef" stroke-width="1.5"/><text x="910.0" y="104" class="name" text-anchor="middle">Проверка</text><path d="M910 134V1280" fill="none" stroke="#d5e2f2" stroke-dasharray="4 5"/><rect x="1076" y="76" width="188" height="58" rx="13" fill="#f2f7ff" stroke="#cbdbef" stroke-width="1.5"/><text x="1170.0" y="104" class="name" text-anchor="middle">Большой экран</text><path d="M1170 134V1280" fill="none" stroke="#d5e2f2" stroke-dasharray="4 5"/><path d="M650 190H1170" class="line dash "/><text x="910.0" y="177" class="label" text-anchor="middle">1. Этап финансов доступен: входные данные готовы</text><path d="M100 256H370" class="line  human"/><text x="235.0" y="243" class="label" text-anchor="middle">2. «Рассчитай полную стоимость заказа»</text><path d="M370 322H650" class="line  "/><text x="510.0" y="309" class="label" text-anchor="middle">3. Поручение: ID стола, ID запроса, текст</text><path d="M650 388H370" class="line  "/><text x="510.0" y="375" class="label" text-anchor="middle">4. Вход: тираж 110 шт. и прайс</text><path d="M650 454H1170" class="line dash "/><text x="910.0" y="441" class="label" text-anchor="middle">5. Помощник начал работу</text><path d="M370 520H650" class="line  "/><text x="510.0" y="507" class="label" text-anchor="middle">6. Смета: 110 × (420 + 80) + 5 000 = 60 000 ₽</text><path d="M650 586H910" class="line  "/><text x="780.0" y="573" class="label" text-anchor="middle">7. Проверить полноту сметы и лимит</text><path d="M910 652H650" class="line  "/><text x="780.0" y="639" class="label" text-anchor="middle">8. В лимите: 60 000 ₽ ≤ 80 000 ₽</text><path d="M650 718H1170" class="line dash "/><text x="910.0" y="705" class="label" text-anchor="middle">9. Результат готов; смета передана закупкам</text><path d="M650 784H370" class="line  "/><text x="510.0" y="771" class="label" text-anchor="middle">10. Структурированный результат для команды</text><path d="M370 850H100" class="line  "/><text x="235.0" y="837" class="label" text-anchor="middle">11. Смета и пояснение расчёта</text><path d="M100 916H370" class="line  human"/><text x="235.0" y="903" class="label" text-anchor="middle">12. «Упаковка и доставка учтены?»</text><path d="M370 982H100" class="line  "/><text x="235.0" y="969" class="label" text-anchor="middle">13. «Да, включены в общую стоимость»</text><path d="M650 1048H100" class="line  "/><text x="375.0" y="1035" class="label" text-anchor="middle">14. Закупки запрашивают решение капитана</text><path d="M100 1114H650" class="line  human"/><text x="375.0" y="1101" class="label" text-anchor="middle">15. Человек согласует заказ</text><path d="M650 1180H1170" class="line dash "/><text x="910.0" y="1167" class="label" text-anchor="middle">16. Переход к производству разрешён</text><text x="30" y="1285" class="body" text-anchor="start">Сплошная стрелка — поручение, данные или решение. Пунктир — событие для визуализации.</text></svg>